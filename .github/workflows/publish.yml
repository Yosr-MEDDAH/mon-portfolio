name: Publish Portfolio to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export CMS & Build Static Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install public dependencies
        run: npm ci
        working-directory: apps/public

      - name: Install admin dependencies
        run: npm ci
        working-directory: apps/admin

      - name: Export published CMS content from Firestore
        run: npm run export:content
        working-directory: apps/public
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static Astro site
        run: npm run build
        working-directory: apps/public
        env:
          NODE_ENV: production

      - name: Build Admin React app
        run: npm run build
        working-directory: apps/admin

      - name: Embed Admin in static distribution
        run: cp -r apps/admin/dist apps/public/dist/admin

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/public/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
